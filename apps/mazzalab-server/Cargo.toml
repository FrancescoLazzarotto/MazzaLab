[package]
name = "mazzalab-server"
description = "MazzaLab show server: runs the engine in real time and exposes OSC and the web client API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mazzalab-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
clap.workspace = true
futures-util = "0.3"
mazzalab-audio.workspace = true
mazzalab-core.workspace = true
mazzalab-engine.workspace = true
mazzalab-osc.workspace = true
mazzalab-project.workspace = true
mazzalab-show.workspace = true
rosc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
