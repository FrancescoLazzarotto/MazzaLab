[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# The web UI is a TypeScript project, not a crate.
exclude = ["apps/mazzalab-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Francesco Lazzarotto"]
repository = "https://github.com/FrancescoLazzarotto/MazzaLab"
publish = false

[workspace.dependencies]
# Internal crates
mazzalab-audio = { path = "crates/mazzalab-audio" }
mazzalab-core = { path = "crates/mazzalab-core" }
mazzalab-engine = { path = "crates/mazzalab-engine" }
mazzalab-osc = { path = "crates/mazzalab-osc" }
mazzalab-project = { path = "crates/mazzalab-project" }
mazzalab-show = { path = "crates/mazzalab-show" }

# External crates
clap = { version = "4.6", features = ["derive"] }
rosc = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.28", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
